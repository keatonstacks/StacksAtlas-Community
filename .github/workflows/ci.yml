name: StacksAtlas Community CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: StacksAtlas.UI/package-lock.json

    - name: Install UI Dependencies
      run: |
        cd StacksAtlas.UI
        npm ci

    - name: Build UI
      run: |
        cd StacksAtlas.UI
        npm run build

    - name: Restore dependencies
      run: dotnet restore StacksAtlas.slnx

    - name: Build Solution
      run: dotnet build StacksAtlas.slnx --no-restore -c Release

    - name: Run Tests
      run: dotnet test StacksAtlas.slnx --no-build -c Release --verbosity normal